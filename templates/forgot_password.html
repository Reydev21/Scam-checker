<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — ScamCheck AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Forgot<br><span class="brand-ai">Password?</span></h1>
      <p>Enter your email and we will send a 6-digit OTP.</p>
    </div>
    {% with messages = get_flashed_messages() %}
    {% if messages %}<div class="flash-msg">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form method="POST" class="auth-form">
      <div class="auth-field">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" value="{{ email or '' }}" required>
      </div>
      <button type="submit" class="auth-submit">Send OTP</button>
    </form>
    {% if otp_sent %}
    <form id="otp-form" class="auth-form" style="margin-top: 1rem;">
      <div class="auth-field">
        <label>6-Digit OTP</label>
        <input type="text" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
      </div>
      <button type="submit" class="auth-submit">Verify OTP</button>
    </form>
    <p id="otp-status" class="auth-link" role="status"></p>
    <script>
      document.getElementById("otp-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const status = document.getElementById("otp-status");
        const email = document.querySelector('input[name="email"]').value.trim();
        const token = event.target.otp.value.trim();
        status.textContent = "Verifying OTP…";
        const response = await fetch("/api/auth/recovery/verify-otp", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({email, token})
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          status.textContent = result.error || "The OTP is invalid or expired.";
          return;
        }
        window.location.href = "/reset-password";
      });
    </script>
    {% endif %}
    <p class="auth-link auth-back-link"><a href="/login">← Back to Sign In</a></p>
  </div>
</div>
</body>
</html>
