<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — ScamCheck AI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Forgot <span class="brand-ai">Password?</span></h1>
      <p>Enter your account email and we will send a reset link.</p>
    </div>
    {% with messages = get_flashed_messages() %}
    {% if messages %}<div class="flash-msg">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form method="POST" class="auth-form">
      <div class="auth-field">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="auth-submit">Send Reset Link</button>
    </form>
    <p class="auth-link auth-back-link"><a href="/login">← Back to Sign In</a></p>
  </div>
</div>
</body>
</html>
