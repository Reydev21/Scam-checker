<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — ScamCheck AI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Reset <span class="brand-ai">Password</span></h1>
      <p>Choose a new password for your account.</p>
    </div>
    {% with messages = get_flashed_messages() %}
    {% if messages %}<div class="flash-msg">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form id="reset-form" class="auth-form">
      <div class="auth-field">
        <label>New Password</label>
        <input type="password" name="password" minlength="8" required>
      </div>
      <div class="auth-field">
        <label>Confirm New Password</label>
        <input type="password" name="confirm" minlength="8" required>
      </div>
      <button type="submit" class="auth-submit">Change Password</button>
    </form>
    <p id="reset-status" class="auth-link" role="status"></p>
  </div>
</div>
<script>
(() => {
  const status = document.getElementById("reset-status");
  const form = document.getElementById("reset-form");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = form.password.value;
    if (password !== form.confirm.value) {
      status.textContent = "Passwords do not match.";
      return;
    }
    status.textContent = "Updating your password…";
    const response = await fetch("/api/auth/recovery/update", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({password})
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      status.textContent = result.error || "The recovery link is invalid or expired.";
      return;
    }
    window.location.href = "/login?reset=success";
  });
})();
</script>
</body>
</html>
